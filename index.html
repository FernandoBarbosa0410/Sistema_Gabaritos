<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Financeiro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">

    <aside class="menu">
        <h2>💰 Finanças</h2>

        <ul>
            <li><a href="#">Dashboard</a></li>
            <li><a href="#">Receitas</a></li>
            <li><a href="#">Despesas</a></li>
            <li><a href="#">Relatórios</a></li>
        </ul>
    </aside>

    <main class="conteudo">

        <h1>Painel Financeiro</h1>

        <p class="data">
            Hoje: 05/06/2026
        </p>

        <div class="acoes">
            <button>+ Nova Receita</button>
            <button>- Nova Despesa</button>
        </div>

        <div class="cards">

        <div class="card">
    <h3>💰 Saldo Atual</h3>
    <p id="saldo">R$ 0,00</p>
</div>

<div class="card">
    <h3>📈 Receitas</h3>
    <p id="receitas">R$ 0,00</p>
</div>

<div class="card">
    <h3>📉 Despesas</h3>
    <p id="despesas">R$ 0,00</p>
</div>
        <div class="grafico">
            <h2>Resumo Financeiro</h2>
            <p>Em breve serão exibidos gráficos e relatórios.</p>
        </div>

    </main>

</div>

<script src="js/script.js"></script>

</body>
</html>
